services:
  migrate:
    build:
      context: ./backend
      target: build
    command:
      - sh
      - -c
      - npm run prisma:migrate:deploy && npm run prisma:seed
    environment:
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - todo_data:/app/data
    restart: "no"

  backend:
    build:
      context: ./backend
      target: production
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: file:/app/data/dev.db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in your shell before starting Compose}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in your shell before starting Compose}
    volumes:
      - todo_data:/app/data
    ports:
      - "3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  todo_data:
